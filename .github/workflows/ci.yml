name: CI

on:
  push:
    branches: [main]
    # A version tag runs every check again, and then the release job.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commits, not tags: a tag can be moved.
jobs:
  test:
    name: Tests and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # House style: no em dashes anywhere outside the vendored reference/
      # files. The character is built from its UTF-8 bytes so this file
      # doesn't contain one itself.
      - name: No em dashes
        run: "! git grep -n \"$(printf '\\xe2\\x80\\x94')\" -- ':!reference'"

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  html:
    name: Release HTML (reproducible)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reference build in the pinned container, twice from clean, compared
        run: scripts/build-reproducible.sh --verify-reproducible
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-phrase-backup-html
          path: |
            dist/recovery-phrase-backup.html
            dist/demo.html
            dist/site/
          if-no-files-found: error

  e2e:
    name: Browser tests against the release HTML, demo and site
    needs: html
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The exact files the reference build produced, not a rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-phrase-backup-html
          path: dist
      - name: Install Playwright (pinned in tests/e2e/package-lock.json)
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
      - name: Run the wizard tests
        working-directory: tests/e2e
        run: npx playwright test

  interop:
    name: Cross-tool recovery suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Run every oracle live (nix shell pinned in scripts/interop/shell.nix)
        run: scripts/interop/run.sh --check-only

  pages:
    name: Deploy the website to GitHub Pages
    # Only the files the reference build produced, only once every check
    # above passed, only from main, and only once the repository is public
    # (a private repository on the free plan has no Pages).
    needs: [test, audit, html, e2e, interop]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-phrase-backup-html
          path: dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Draft the GitHub release
    # The files the reference build produced, once every check above passed
    # on the tagged commit. A draft: it goes public only when published by
    # hand.
    needs: [test, audit, html, e2e, interop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-phrase-backup-html
          path: dist
      - name: The tag, Cargo.toml and the page agree on the version
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import build; print(build.workspace_version())')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          grep -qF "<span id=\"version\">v$version</span>" dist/recovery-phrase-backup.html
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum recovery-phrase-backup.html | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/recovery-phrase-backup.html
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(cut -d' ' -f1 dist/SHA256SUMS)
          prerelease=
          : > notes.md
          case "$GITHUB_REF_NAME" in
            v0.*)
              prerelease=--prerelease
              printf '%s\n\n' "**Pre-release, not yet independently reviewed.** Until v1, don't use it for a phrase that guards real funds." > notes.md
              ;;
          esac
          cat >> notes.md <<NOTES
          Recovery Phrase Backup splits a BIP39 recovery phrase into SLIP-39 shares, so that no single place can lose it or reveal it, and recovers it from them. It is one HTML file that runs offline in a browser. See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for how it works.

          **Check the download.** Download \`recovery-phrase-backup.html\` and \`SHA256SUMS\` into one folder and, while still online, run:

          \`\`\`sh
          shasum -a 256 -c SHA256SUMS
          gh attestation verify recovery-phrase-backup.html --repo $GITHUB_REPOSITORY
          \`\`\`

          The first command checks the file's SHA-256 (\`$hash\`). The second needs the [GitHub CLI](https://cli.github.com): it checks GitHub's attestation that this repository's CI built the file from tag $GITHUB_REF_NAME. To check the file against the source without trusting GitHub, run \`git checkout $GITHUB_REF_NAME\` and then \`scripts/build-reproducible.sh\` (needs Docker): it prints the same hash.

          **Use it.** Start a computer from an Ubuntu USB stick ("Try Ubuntu"), keep it offline, copy the file into the Home folder and open it in Firefox. If you can't, at least disconnect from the network and use a fresh browser profile without extensions. On Tails, set Tor Browser's security level to Standard: Safer and Safest block WebAssembly, which the page needs.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag $prerelease \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/recovery-phrase-backup.html dist/SHA256SUMS
