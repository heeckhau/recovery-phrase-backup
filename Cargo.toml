[workspace]
resolver = "2"
members = ["core", "cli", "wasm", "slip39"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# The release HTML's wasm (scripts/build.py): small, and one codegen unit
# for reproducible output. A separate profile keeps the CLI's release build
# as it is.
[profile.html]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
