[package]
name = "rpb-slip39"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitvec = { version = "1.1", default-features = false, features = ["alloc"] }
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = "0.13"
zeroize = { version = "1.9", features = ["derive"] }
thiserror = "2.0"
getrandom = "0.4"
subtle = { version = "2.6", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# Only for the cross-tool suite's phrase-level checks (tests/interop.rs and
# examples/interop.rs); the library itself stays independent of rpb-core.
rpb-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
# `cfg(kani)` is set by `cargo kani`, for the proofs next to the tests.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
